[project]
name = "travelos-optimization"
version = "0.1.0"
description = "Optimization service: ranks policy-permitted travel bundles with OR-Tools and explains every score."
requires-python = ">=3.12"
# OR-Tools 9.15 pins protobuf 6.33.x; the grpc family moved to protobuf 7 at 1.81+. Until
# OR-Tools catches up, the grpc packages stay on the last protobuf-6 line.
dependencies = [
    "grpcio>=1.80,<1.81",
    "grpcio-health-checking>=1.80,<1.81",
    "grpcio-reflection>=1.80,<1.81",
    "protobuf>=6.33.1,<7",
    "ortools>=9.15",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.80,<1.81",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travelos_optimization", "src/travelos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/travelos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
# The generated `travelos` package may not exist yet when lint runs (CI); classify it explicitly so
# import sorting does not depend on build order.
known-first-party = ["travelos", "travelos_optimization"]
