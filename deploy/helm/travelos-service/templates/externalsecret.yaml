{{- if .Values.externalSecret.enabled }}
# Secrets Manager -> Kubernetes Secret, refreshed by External Secrets Operator. The Secret name is
# what secretRef points at; nothing sensitive is in values or git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretRef | required "secretRef is required when externalSecret is enabled" }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.secretRef }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
