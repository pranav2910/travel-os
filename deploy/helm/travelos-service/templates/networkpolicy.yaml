{{- if .Values.networkPolicy.enabled }}
{{- $name := include "svc.name" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if and .Values.ports.http .Values.networkPolicy.httpFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.httpFrom | nindent 8 }}
      ports:
        - port: {{ .Values.ports.http }}
    {{- end }}
    {{- if and .Values.ports.grpc .Values.networkPolicy.grpcFromApps }}
    - from:
        {{- range .Values.networkPolicy.grpcFromApps }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
        {{- if .Values.networkPolicy.grpcFromOutside }}
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        - port: {{ .Values.ports.grpc }}
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Platform infrastructure (Postgres, Kafka, Temporal, Keycloak, OTel) in its own namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.infraNamespace }}
      ports:
        {{- range .Values.networkPolicy.infraPorts }}
        - port: {{ . }}
        {{- end }}
    {{- range .Values.networkPolicy.grpcToApps }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .app }}
      ports:
        - port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
