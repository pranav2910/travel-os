# AWS Load Balancer Controller (eks-charts) for the travelos EKS clusters.
#   helm repo add eks https://aws.github.io/eks-charts
#   helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller -n kube-system \
#     -f deploy/helm/addons/aws-load-balancer-controller.values.yaml \
#     --set clusterName=$(terraform output -raw cluster_name) \
#     --set region=<region> --set vpcId=$(terraform output -raw vpc_id) \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$(terraform output -json irsa_role_arns | jq -r '."aws-load-balancer-controller"')
# The IAM role/policy is created by infrastructure/terraform/modules/irsa (vendored upstream policy).
replicaCount: 2
serviceAccount:
  create: true
  name: aws-load-balancer-controller     # must match the IRSA binding in modules/irsa
  annotations:
    eks.amazonaws.com/role-arn: ""
enableServiceMutatorWebhook: false       # we do not want every Service turned into an NLB
defaultTags:
  project: travelos
podDisruptionBudget:
  maxUnavailable: 1
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }
