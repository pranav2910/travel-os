{{- if .Values.ingress.enabled }}
# North-south entry for the public REST APIs only. On EKS the class is `alb` and the AWS Load
# Balancer Controller turns this into an internet-facing ALB with IP targets (pods directly, so
# each service's NetworkPolicy must admit the VPC CIDR on its HTTP port - see values-eks.yaml).
# Internal services (supplier-gateway, the worker, the Python gRPC services) are never routed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelos
  labels:
    app.kubernetes.io/part-of: travelos
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .Values.ingress.routes }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
{{- end }}
