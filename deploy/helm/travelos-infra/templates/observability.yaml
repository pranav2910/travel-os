{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      enableServiceLinks: false
      containers:
        - name: collector
          image: {{ .Values.observability.collectorImage }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/otelcol }]
      volumes:
        - name: config
          configMap: { name: {{ .Values.observability.collectorConfigMap }}, items: [{ key: otel-collector.yaml, path: config.yaml }] }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  type: NodePort
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, nodePort: {{ .Values.observability.tempoNodePort }} }
    - { name: otlp-grpc, port: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      enableServiceLinks: false
      containers:
        - name: tempo
          image: {{ .Values.observability.tempoImage }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          env:
            - { name: GOMEMLIMIT, value: "600MiB" }   # Go GC works to stay under the limit; WAL replay after a restart is the peak
          ports:
            - { containerPort: 3200 }
            - { containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            periodSeconds: 10
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - name: config
          configMap: { name: {{ .Values.observability.tempoConfigMap }} }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, nodePort: {{ .Values.observability.grafanaNodePort }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          image: {{ .Values.observability.grafanaImage }}
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
      volumes:
        - name: datasources
          configMap: { name: {{ .Values.observability.grafanaDatasourcesConfigMap }} }
{{- end }}
