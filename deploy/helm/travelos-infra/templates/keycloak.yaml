apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector: { app: keycloak }
  ports: [{ name: http, port: 8180, nodePort: {{ .Values.keycloak.nodePort }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      enableServiceLinks: false
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm", "--http-port=8180"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.keycloak.adminSecret }}, key: KC_BOOTSTRAP_ADMIN_PASSWORD } }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            # Keycloak's default heap is 70% of the cgroup limit; with metaspace, code cache and
            # native buffers on top that exceeds the limit under token load and the kernel kills
            # the pod (seen after ~70 min of E2E traffic). Half the limit leaves room for the rest.
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25" }
          ports:
            - { containerPort: 8180, name: http }
            - { containerPort: 9000, name: mgmt }
          startupProbe:
            httpGet: { path: /health/ready, port: mgmt }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: mgmt }
            periodSeconds: 10
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: {{ .Values.keycloak.realmConfigMap }} }
