apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  selector: { app: temporal }
  ports: [{ name: grpc, port: 7233 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      labels: { app: temporal }
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: DBNAME, value: temporal }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
            - { name: SKIP_DB_CREATE, value: "true" }
            - { name: DEFAULT_NAMESPACE, value: travelos }
            - { name: BIND_ON_IP, value: "0.0.0.0" }
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: config/dynamicconfig/development-sql.yaml }
            - { name: TEMPORAL_ADDRESS, value: "127.0.0.1:7233" }
          envFrom:
            - secretRef: { name: {{ .Values.temporal.dbSecret }} }
          ports: [{ containerPort: 7233, name: grpc }]
          # The CLI health call under exec's 1s default timeout flaps whenever the node is busy, and a
          # NotReady frontend drops out of the Service: workers and signals lose Temporal. The
          # frontend serves grpc.health.v1, which the kubelet can ask directly and cheaply.
          startupProbe:
            exec: { command: ["sh", "-c", "temporal operator cluster health --address 127.0.0.1:7233 | grep -q SERVING"] }
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 60
          readinessProbe:
            grpc: { port: 7233 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.temporal.resources | nindent 12 }}
          volumeMounts:
            - { name: dynamicconfig, mountPath: /etc/temporal/config/dynamicconfig }
      volumes:
        - name: dynamicconfig
          configMap: { name: {{ .Values.temporal.dynamicConfigConfigMap }} }
{{- if .Values.temporal.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
spec:
  type: NodePort
  selector: { app: temporal-ui }
  ports: [{ name: http, port: 8080, nodePort: {{ .Values.temporal.ui.nodePort }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-ui }
  template:
    metadata:
      labels: { app: temporal-ui }
    spec:
      enableServiceLinks: false
      containers:
        - name: ui
          image: {{ .Values.temporal.uiImage }}
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 128Mi } }
{{- end }}
