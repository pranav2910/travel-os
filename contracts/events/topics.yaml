# Kafka topic registry — the ONLY place topics are declared. Brokers run with auto-create disabled;
# platform tooling (platform/local/kafka/create-topics.sh locally, Terraform/MSK in cloud) creates
# exactly this list. A test in libs/events keeps this file, Topics.java and the local script in sync.
#
# Keying rule: every event is keyed by correlationId (the trip id), so all events of one trip land
# on one partition in order. Consumers may rely on per-trip ordering and on nothing else.
version: 1

defaults:
  partitions: 12
  replication: 3
  retention_ms: 604800000   # 7 days
  key: correlationId

topics:
  - name: travel.intent
    slice: 4
    events: [travel.intent.detected, travel.intent.confirmed, travel.intent.rejected]

  - name: travel.trip
    slice: 1
    events: [travel.trip.created, travel.trip.planned, travel.trip.quoted, travel.trip.purchase-authorized, travel.trip.replanned, travel.trip.booked, travel.trip.cancellation-requested, travel.trip.component-cancellation-requested, travel.trip.components-released, travel.trip.cancellation-incomplete, travel.trip.cancelled, travel.trip.failed, travel.trip.completed]

  - name: travel.search
    slice: 1
    events: [travel.search.started, travel.search.completed, travel.search.failed]

  - name: travel.policy
    slice: 1
    events: [travel.policy.published, travel.policy.evaluated, travel.policy.violation]

  - name: travel.optimization
    slice: 1
    events: [travel.optimization.completed]

  - name: travel.approval
    slice: 1
    events: [travel.approval.requested, travel.approval.approved, travel.approval.rejected, travel.approval.escalated, travel.approval.expired]

  - name: travel.order
    slice: 1
    events: [travel.order.created, travel.order.confirmed, travel.order.change-requested, travel.order.changed, travel.order.cancelled, travel.order.items-released, travel.order.failed, travel.order.compensation-failed, travel.order.exposure-resolved]

  - name: travel.disruption
    slice: 2
    events: [travel.disruption.detected, travel.disruption.impact-confirmed, travel.disruption.recovery-started, travel.disruption.decision-ready, travel.disruption.approval-required, travel.disruption.resolved, travel.disruption.recovery-failed]

  - name: travel.expense
    slice: 4
    events: [travel.expense.created, travel.expense.reconciled]

  - name: travel.demand
    slice: 4
    events: [travel.demand.sync-requested, travel.demand.sync-completed, travel.demand.sync-failed, travel.demand.candidate-detected, travel.demand.candidate-updated, travel.demand.candidate-withdrawn, travel.demand.candidate-dismissed, travel.demand.candidate-converted, travel.demand.candidate-changed-after-conversion]

  - name: travel.learning
    slice: 5
    events: [travel.learning.build-requested, travel.learning.profile-built, travel.learning.profile-evaluated, travel.learning.build-failed, travel.learning.profile-activated, travel.learning.profile-rolled-back, travel.learning.mode-changed, travel.learning.feedback-recorded]

  - name: travel.agent
    slice: 1
    events: [travel.agent.action.requested, travel.agent.action.completed, travel.agent.action.rejected]

  - name: travel.finance
    slice: 6
    events: [travel.finance.payment-authorized, travel.finance.payment-captured, travel.finance.payment-voided, travel.finance.payment-refunded, travel.finance.payment-declined, travel.finance.payable-recorded, travel.finance.payable-settled, travel.finance.credit-issued, travel.finance.credit-applied, travel.finance.credit-expired]

  - name: travel.assistance
    slice: 6
    events: [travel.assistance.case-opened, travel.assistance.case-assigned, travel.assistance.case-escalated, travel.assistance.case-resolved, travel.assistance.case-closed, travel.assistance.notification-sent, travel.assistance.advisory-issued, travel.assistance.checkin-recorded]

  - name: travel.audit
    slice: 1
    retention_ms: 2592000000   # 30 days on the bus; durable copy lives in the Audit service (OpenSearch + S3)
    events: [travel.audit.recorded]
