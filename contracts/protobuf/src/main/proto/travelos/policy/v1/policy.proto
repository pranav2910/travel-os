syntax = "proto3";

package travelos.policy.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";
import "travelos/offer/v1/offer.proto";
import "travelos/trip/v1/trip.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.policy.v1";
option java_outer_classname = "PolicyProto";

// Deterministic. Versioned. Explainable. Never returns a bare boolean.
service PolicyService {
  // "Can these itineraries be booked for this traveler?" — one decision per candidate bundle.
  rpc EvaluateTrip(EvaluateTripRequest) returns (EvaluateTripResponse);
  // "May this principal (typically an agent) do THIS action NOW?" e.g. rebook an existing order for +$83.
  rpc EvaluateAction(EvaluateActionRequest) returns (PolicyDecision);
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  ALLOW = 1;
  ALLOW_WITH_APPROVAL = 2;
  DENY = 3;
  // Bookable without approval, but the traveler pays economics.traveler_pays out of pocket.
  ALLOW_WITH_TRAVELER_PAYMENT = 4;
}

// The money consequences of a candidate for the traveler. Policy is an incentive, not only a gate:
// in-policy choices below the ceiling earn a reward, choices above it cost the traveler the excess.
message Economics {
  // Lowest logical fare among the candidates evaluated together (the policy's benchmark).
  travelos.common.v1.Money reference_fare = 1;
  // reference_fare + the policy's permitted band. At or below this is in policy.
  travelos.common.v1.Money in_policy_ceiling = 2;
  // Reward earned by choosing this candidate (zero when none).
  travelos.common.v1.Money traveler_incentive = 3;
  // Amount the traveler pays personally when the candidate exceeds the ceiling (zero when none).
  travelos.common.v1.Money traveler_pays = 4;
}

message ReasonCode {
  // Stable machine code, e.g. "CABIN_NOT_PERMITTED".
  string code = 1;
  string rule_id = 2;
  // Human-readable, safe to show to the traveler.
  string message = 3;
}

message ApproverRequirement {
  // MANAGER | TRAVEL_ADMIN | FINANCE
  string role = 1;
  string reason_code = 2;
}

message PolicyDecision {
  string decision_id = 1;
  string policy_id = 2;
  int32 policy_version = 3;

  Outcome outcome = 4;
  repeated string rules_evaluated = 5;
  repeated ReasonCode reasons = 6;

  bool requires_approval = 7;
  repeated ApproverRequirement approvers = 8;

  google.protobuf.Timestamp evaluated_at = 9;

  // Present for trip/bundle evaluations and for actions that propose a bundle.
  Economics economics = 10;
  // Phase 3: may the platform purchase this plan without a person's confirmation? True only when
  // the policy's autonomy.purchase is enabled, the total is within its limit and the plan is not
  // denied. Approval, when required, is still a person's decision.
  bool autonomous_purchase = 11;
  travelos.common.v1.Money autonomous_purchase_limit = 12;
}

message EvaluateTripRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  string traveler_id = 3;
  travelos.trip.v1.TravelIntent intent = 4;
  repeated travelos.offer.v1.Bundle candidates = 5;
  // Phase 3: "now" for the booking-horizon rules (the workflow's clock); the service's clock
  // when unset. The engine itself stays clock-free.
  google.protobuf.Timestamp reference_time = 6;
}

message CandidateDecision {
  string bundle_id = 1;
  PolicyDecision decision = 2;
}

message EvaluateTripResponse {
  string evaluation_id = 1;
  repeated CandidateDecision candidates = 2;
}

message EvaluateActionRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  string traveler_id = 3;
  // Capability being exercised: "order.create" | "order.change" (alias CHANGE_EXISTING_ORDER) |
  // "order.cancel".
  string action = 4;
  travelos.common.v1.Money incremental_cost = 5;
  travelos.offer.v1.Bundle proposed = 6;
  // The frozen intent the trip was planned for. When present, a proposed itinerary must satisfy its
  // time constraints (arrival deadline, return window) or the action is denied.
  travelos.trip.v1.TravelIntent intent = 7;
  // Why the action is being taken, for the evidence row (e.g. a disruption id). Never a rule input.
  string context_ref = 8;
}
