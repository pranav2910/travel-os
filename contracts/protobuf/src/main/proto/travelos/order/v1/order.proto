syntax = "proto3";

package travelos.order.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";
import "travelos/offer/v1/offer.proto";
import "travelos/supplier/v1/supplier.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.order.v1";
option java_outer_classname = "OrderProto";

// The transactional truth. Every command is idempotent: N retries => 1 order.
service OrderService {
  rpc CreateOrder(CreateOrderCommand) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc CancelOrder(CancelOrderCommand) returns (Order);
  // Slice 2: replace the itinerary of a confirmed order (disruption recovery). Idempotent by
  // ctx.idempotency_key, e.g. TRIP:<tripId>:DISRUPTION:<disruptionId>:CHANGE:1.
  rpc ChangeOrder(ChangeOrderCommand) returns (Order);
  // Impacted-trip detection: which order did the supplier's notice hit?
  rpc FindOrderByExternalRef(FindOrderByExternalRefRequest) returns (Order);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  CREATING = 1;
  HELD = 2;
  PAYMENT_PENDING = 3;
  CONFIRMING = 4;
  CONFIRMED = 5;
  CHANGE_PENDING = 6;
  CHANGED = 7;
  CANCELLATION_PENDING = 8;
  CANCELLED = 9;
  FAILED = 10;
  PARTIALLY_FAILED = 11;
}

enum OrderItemStatus {
  ORDER_ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_PENDING = 1;
  ITEM_HELD = 2;
  ITEM_CONFIRMED = 3;
  ITEM_FAILED = 4;
  ITEM_CANCELLED = 5;
  // Replaced by a later item through a change (disruption recovery). Kept for the history.
  ITEM_CHANGED = 6;
  // Slice 3: confirmed at the supplier but our cancellation failed; the exposure is recorded and
  // a person must act.
  ITEM_CANCEL_FAILED = 7;
  // Phase 4: the supplier may or may not have booked it (answer lost, no lookup by our key);
  // never retried by a machine, exposed for a person to reconcile.
  ITEM_UNKNOWN = 8;
}

message OrderItem {
  string item_id = 1;
  travelos.offer.v1.Offer offer = 2;
  OrderItemStatus status = 3;
  string external_ref = 4;
  string record_locator = 5;
  // Slice 3
  string component_id = 6;
  travelos.common.v1.Money total = 7;
  string failure_code = 8;
}

// Slice 3: money the company may have lost because a confirmed component could not be released.
message Exposure {
  string exposure_id = 1;
  string item_id = 2;
  string component_id = 3;
  string provider = 4;
  string external_ref = 5;
  travelos.common.v1.Money amount = 6;
  // COMPENSATION_FAILED | NON_REFUNDABLE | CANCELLATION_REFUSED (a person asked to cancel; the
  // supplier refused to release the component)
  string reason = 7;
  string detail = 8;
  // OPEN | RESOLVED
  string status = 9;
  string resolved_by = 10;
  string resolution = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp resolved_at = 13;
}

message Order {
  string order_id = 1;
  string tenant_id = 2;
  string trip_id = 3;

  string supplier = 4;
  string external_order_id = 5;

  OrderStatus status = 6;
  travelos.common.v1.Money total = 7;
  repeated OrderItem items = 8;

  string idempotency_key = 9;

  // Evidence chain — the decision ledger hangs off these.
  string policy_decision_id = 10;
  string optimization_run_id = 11;
  string approval_id = 12;

  int64 version = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;

  // Set on FAILED / PARTIALLY_FAILED: stable machine code and whether every confirmed
  // component was released again.
  string failure_code = 16;
  bool compensated = 17;

  // Slice 2: the change history. The latest change explains how the current items came to be.
  repeated OrderChange changes = 18;
  string traveler_id = 19;
  string bundle_id = 20;
  // Slice 3: open and resolved exposures from failed compensation.
  repeated Exposure exposures = 21;
}

// One applied (or attempted) change of an order's itinerary.
message OrderChange {
  string change_id = 1;
  string disruption_id = 2;
  string idempotency_key = 3;
  // PENDING | APPLIED | FAILED
  string status = 4;
  string previous_bundle_id = 5;
  string replacement_bundle_id = 6;
  travelos.common.v1.Money incremental_cost = 7;
  string policy_decision_id = 8;
  string optimization_run_id = 9;
  string approval_id = 10;
  string external_order_id = 11;
  string record_locator = 12;
  string failure_code = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message CreateOrderCommand {
  // ctx.idempotency_key is REQUIRED.
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  string traveler_id = 3;
  travelos.offer.v1.Bundle bundle = 4;

  string policy_decision_id = 5;
  string optimization_run_id = 6;
  // Empty when policy did not require approval.
  string approval_id = 7;

  // Who travels, as the supplier needs it. Comes from the traveler profile (Enterprise Context).
  repeated travelos.supplier.v1.Passenger passengers = 8;
  // Opaque token from the payment provider (corporate card / virtual card). Never a PAN.
  string payment_token = 9;
}

message GetOrderRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string order_id = 2;
}

message CancelOrderCommand {
  travelos.common.v1.RequestContext ctx = 1;
  string order_id = 2;
  string reason = 3;
  // Phase 6: release only these itinerary components (a partial cancellation); the order stays
  // as it is for the rest. Empty = the whole order, as before.
  repeated string component_ids = 4;
}

message ChangeOrderCommand {
  // ctx.idempotency_key is REQUIRED.
  travelos.common.v1.RequestContext ctx = 1;
  string order_id = 2;
  string disruption_id = 3;
  // The itinerary that replaces the current items. Selected by the optimizer, authorized by policy.
  travelos.offer.v1.Bundle replacement = 4;
  string policy_decision_id = 5;
  string optimization_run_id = 6;
  // Empty when policy allowed the change without a person.
  string approval_id = 7;
  repeated travelos.supplier.v1.Passenger passengers = 8;
  string payment_token = 9;
  string reason = 10;
  // Slice 3: when the replacement's offers carry component ids, only those components change and
  // every other item is preserved; without component ids (Slice 2) the whole itinerary is replaced.
}

message FindOrderByExternalRefRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string supplier = 2;
  string external_order_id = 3;
}
