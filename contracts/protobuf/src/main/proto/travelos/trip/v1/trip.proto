syntax = "proto3";

package travelos.trip.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.trip.v1";
option java_outer_classname = "TripProto";

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  SUBMITTED = 2;
  PLANNING = 3;
  AWAITING_APPROVAL = 4;
  APPROVED = 5;
  BOOKING = 6;
  BOOKED = 7;
  CANCELLED = 8;
  FAILED = 9;
  // A booked trip whose cancellation was requested: the reservation is being released at the
  // suppliers; CANCELLED only once that is established (or nothing was left to release).
  CANCELLING = 10;
}

// What the traveler needs, independent of how it is fulfilled.
// Produced by intent extraction (an LLM, or an explicit form) and then frozen — search, policy and
// optimization all reason over this, never over the original free text.
message TravelIntent {
  // IATA airport codes.
  string origin = 1;
  string destination = 2;

  google.protobuf.Timestamp earliest_departure = 3;
  google.protobuf.Timestamp arrival_deadline = 4;
  google.protobuf.Timestamp return_after = 5;
  google.protobuf.Timestamp latest_return = 6;

  string purpose = 7;
  bool hotel_required = 8;
  // Slice 1: always 1.
  int32 travelers = 9;

  // Slice 3: the ordered components of a multi-city itinerary. When present, origin/destination
  // and the four timestamps above describe the first leg and the last leg for compatibility, and
  // planning reasons over the itinerary. Absent for Slice 1/2 shaped trips.
  Itinerary itinerary = 10;
}

// Ordered, dependency-linked components with stable ids. Every instant is UTC; every component
// also carries the IANA zone its local calendar lives in (nights, pickup times, deadlines are
// local facts).
message Itinerary {
  repeated Leg legs = 1;
  repeated Stay stays = 2;
  repeated Transfer transfers = 3;
  // The single currency every component must be quoted in (policy rejects anything else).
  string currency = 4;
}

// One flight leg (one-way). Multi-city = an ordered list of legs.
message Leg {
  string component_id = 1;
  int32 sequence = 2;
  string origin = 3;
  string destination = 4;
  google.protobuf.Timestamp earliest_departure = 5;
  google.protobuf.Timestamp arrival_deadline = 6;
  string origin_time_zone = 7;
  string destination_time_zone = 8;
  // The leg (if any) that must have landed before this one departs.
  repeated string depends_on = 9;
}

// A hotel stay in one city between two legs.
message Stay {
  string component_id = 1;
  // IATA city/airport code the stay serves.
  string city = 2;
  // ISO local dates on the property's calendar.
  string check_in_date = 3;
  string check_out_date = 4;
  string time_zone = 5;
  int32 nights = 6;
  // A required component fails the itinerary when it cannot be fulfilled; optional ones are skipped.
  bool required = 7;
  // The arriving leg (check-in follows its arrival) and the departing leg (check-out precedes it).
  repeated string depends_on = 8;
}

// A scheduled ground transfer tied to a leg's arrival or departure.
message Transfer {
  string component_id = 1;
  // AIRPORT_TO_HOTEL | HOTEL_TO_AIRPORT | POINT_TO_POINT
  string kind = 2;
  string city = 3;
  string from_location = 4;
  string to_location = 5;
  // Planned pickup. For AIRPORT_TO_HOTEL it is derived from the arriving leg's landing time plus
  // the transfer buffer at planning time and re-derived whenever that leg changes.
  google.protobuf.Timestamp pickup = 6;
  string time_zone = 7;
  bool required = 8;
  repeated string depends_on = 9;
}

// Slice 3: where each component of the itinerary stands. Reported by the workflow (coordination
// state) and reconciled with the Order service (transactional state) through idempotent calls.
message ComponentState {
  string component_id = 1;
  // AIR | HOTEL | GROUND
  string type = 2;
  // PLANNED | QUOTED | REVALIDATING | BOOKING | CONFIRMED | FAILED | CANCELLED | CANCEL_FAILED |
  // CHANGED | SKIPPED
  string status = 3;
  string offer_id = 4;
  string provider = 5;
  string external_ref = 6;
  travelos.common.v1.Money total = 7;
  string failure_code = 8;
  // One line a person can read: "DL240 BOS-SEA 06 Oct 08:30 -> 11:45 local".
  string summary = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Trip {
  string trip_id = 1;
  string tenant_id = 2;
  string traveler_id = 3;

  TravelIntent intent = 4;
  TripStatus status = 5;

  // Evidence chain: set as the trip moves through planning.
  string selected_bundle_id = 6;
  string optimization_run_id = 7;
  string policy_decision_id = 8;
  string approval_id = 9;
  string order_id = 10;

  int64 version = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;

  // Who travels, as captured from the identity provider at request time. The Enterprise Context
  // service replaces this snapshot with the real traveler profile in a later slice.
  TravelerSnapshot traveler = 14;
  // Total of the selected bundle once planned.
  travelos.common.v1.Money total = 15;
  string request_text = 16;
  // PENDING | APPROVED | REJECTED, or empty when no approval was ever requested.
  string approval_status = 17;
  string failure_stage = 18;
  string failure_code = 19;
  // Plain-language narration of the plan, produced from the decision evidence at planning time.
  // Empty when the LLM gateway was unavailable: narration degrades, transactions do not.
  string explanation = 20;
  // Slice 3: component-level status, empty for Slice 1/2 shaped trips.
  repeated ComponentState components = 21;
}

message TravelerSnapshot {
  string traveler_id = 1;
  string given_name = 2;
  string family_name = 3;
  string email = 4;
}

// Internal API used by the trip workflow. Travel Core stays the owner of trip state; the workflow
// asks it to move, and every move is validated against the lifecycle and recorded as history.
service TravelCoreService {
  rpc GetTrip(GetTripRequest) returns (Trip);
  // Slice 4: a trusted service (Enterprise Context) submits a trip on a person's behalf, e.g. when
  // a detected travel demand is converted. The person is ctx.principal; their roles are relayed as
  // validated by the caller's JWT. Idempotent by ctx.idempotency_key within the tenant.
  rpc CreateTrip(CreateTripRequest) returns (Trip);
  // Idempotent: asking for the current status returns the trip unchanged.
  rpc TransitionTrip(TransitionTripRequest) returns (Trip);
  // Records what intent extraction concluded. EXTRACTED freezes the intent on a SUBMITTED trip;
  // every outcome lands in the agent-decision ledger with its model-call evidence.
  rpc ApplyIntentExtraction(ApplyIntentExtractionRequest) returns (Trip);
  // Slice 3: upserts component states (idempotent: the same state twice is one row).
  rpc UpdateComponents(UpdateComponentsRequest) returns (Trip);
}

message UpdateComponentsRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  repeated ComponentState components = 3;
}

message GetTripRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
}

message TransitionTripRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  TripStatus to = 3;
  string reason = 4;

  // Evidence, set when known.
  string selected_bundle_id = 5;
  string optimization_run_id = 6;
  string policy_decision_id = 7;
  string order_id = 8;
  travelos.common.v1.Money total = 9;

  // AWAITING_APPROVAL: the role that must approve. Travel Core creates the approval record and
  // returns its id in Trip.approval_id; the decision arrives as a workflow signal.
  string approver_role = 10;
  // FAILED: where and why. failure_code is a stable machine code.
  string failure_stage = 11;
  string failure_code = 12;
  // AWAITING_APPROVAL / APPROVED: narration generated from the evidence, if any.
  string explanation = 13;
  // Slice 3: a second AWAITING_APPROVAL after a material change on revalidation names why.
  // QUOTE_EXPIRED | PRICE_CHANGED
  string replan_reason = 14;
}

message ApplyIntentExtractionRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  // EXTRACTED | NEEDS_CLARIFICATION | NOT_A_TRAVEL_REQUEST
  string result = 3;
  TravelIntent intent = 4;
  repeated string missing_fields = 5;
  string clarifying_question = 6;
  repeated string assumptions = 7;
  double confidence = 8;
  travelos.common.v1.ModelCall call = 9;
}

// Slice 4: trip creation by a trusted service on a person's behalf.
message CreateTripRequest {
  travelos.common.v1.RequestContext ctx = 1;   // principal = the person; idempotency_key required
  string traveler_id = 2;
  TravelIntent intent = 3;                     // frozen intent (an itinerary or the Slice 1 shape)
  string source = 4;                           // WEB | API | AGENT | CALENDAR | EMAIL | DEMAND
  string source_reference = 5;                 // e.g. the demand candidate id dmd_<ulid>
  string request_text = 6;                     // optional; untrusted, carried as data
  repeated string actor_roles = 7;             // realm roles of ctx.principal, from their JWT
  string actor_employee_id = 8;                // employee id of ctx.principal, from their JWT
}
