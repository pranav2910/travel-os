syntax = "proto3";

package travelos.optimization.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";
import "travelos/offer/v1/offer.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.optimization.v1";
option java_outer_classname = "OptimizationProto";

// Chooses among policy-permitted candidates. Returns the WHOLE ranking with a score breakdown,
// so "why this one?" is answerable without re-running anything.
service OptimizationService {
  rpc OptimizeTrip(OptimizeTripRequest) returns (OptimizeTripResponse);
  // Slice 3: choose one offer per itinerary component so the whole itinerary is feasible
  // (chronology, transfer buffers, hotel-night coverage, budget, one currency) and cheapest by the
  // weighted objectives. Infeasibility is explained per component with stable reason codes.
  rpc OptimizeItinerary(OptimizeItineraryRequest) returns (OptimizeItineraryResponse);
}

// Hard constraints: violating any one makes a candidate infeasible, regardless of score.
message ConstraintSet {
  google.protobuf.Timestamp arrival_deadline = 1;
  google.protobuf.Timestamp return_after = 2;
  repeated travelos.common.v1.Cabin allowed_cabins = 3;
  travelos.common.v1.Money max_total = 4;
  repeated string permitted_providers = 5;
  // Absent => unconstrained. 0 => nonstop only. (optional: proto3 scalars have no presence.)
  optional int32 max_stops = 6;
}

// Soft objectives. Score(x) = w_cost*C + w_time*T + w_risk*R + w_preference*P + w_experience*X.
message Weights {
  double cost = 1;
  double time = 2;
  double risk = 3;
  double preference = 4;
  double experience = 5;
}

message OptimizationPreferences {
  Weights weights = 1;
  repeated string preferred_carriers = 2;
  repeated string preferred_hotels = 3;
}

message ScoreBreakdown {
  double cost = 1;
  double time = 2;
  double risk = 3;
  double preference = 4;
  double experience = 5;
}

message RankedCandidate {
  string bundle_id = 1;
  // 0..100, higher is better. Infeasible candidates score 0 and carry reasons.
  double score = 2;
  ScoreBreakdown breakdown = 3;
  bool feasible = 4;
  repeated string infeasibility_reasons = 5;
  int32 rank = 6;
}

message OptimizeTripRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  repeated travelos.offer.v1.Bundle candidates = 3;
  ConstraintSet constraints = 4;
  OptimizationPreferences preferences = 5;
  // Slice 5: the learned inputs the workflow resolved and pinned for this attempt (may be absent).
  LearningInputs learning = 6;
}

message OptimizeTripResponse {
  string optimization_run_id = 1;
  // Empty when no candidate is feasible.
  string selected_bundle_id = 2;
  repeated RankedCandidate ranking = 3;
  string solver = 4;
  int64 solve_time_ms = 5;
  // Slice 5: what learning did (or would have done) to this ranking.
  LearningEvidence learning = 6;
}

// ---------------------------------------------------------------- Slice 3

// The offers a supplier search returned for one component of the itinerary.
message ComponentCandidates {
  string component_id = 1;
  travelos.offer.v1.OfferType type = 2;
  int32 sequence = 3;
  bool required = 4;
  repeated string depends_on = 5;
  repeated travelos.offer.v1.Offer offers = 6;
  // AIR: the leg must depart at/after not_before and land at/before not_after.
  // GROUND: the pickup must fall in the window. HOTEL: unused (dates are on the stay).
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
  // HOTEL: the stay's local dates and zone, for night coverage.
  string check_in_date = 9;
  string check_out_date = 10;
  string time_zone = 11;
  // GROUND: AIRPORT_TO_HOTEL pickups follow the arriving leg; HOTEL_TO_AIRPORT drop-offs precede
  // the departing leg. Named so the solver can tie the transfer to the chosen flight.
  string arrival_leg_id = 12;
  string departure_leg_id = 13;
}

message ItineraryConstraints {
  travelos.common.v1.Money max_total = 1;
  repeated travelos.common.v1.Cabin allowed_cabins = 2;
  repeated string permitted_providers = 3;
  // Legs: the next leg departs at least this long after the previous one lands. Default 60.
  int32 min_connection_minutes = 4;
  // Transfers: pickup at least this long after landing; drop-off at least this long before
  // departure. Defaults 45 / 90.
  int32 transfer_after_arrival_minutes = 5;
  int32 transfer_before_departure_minutes = 6;
  string currency = 7;
  optional int32 max_stops = 8;
}

message OptimizeItineraryRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string trip_id = 2;
  repeated ComponentCandidates components = 3;
  ItineraryConstraints constraints = 4;
  OptimizationPreferences preferences = 5;
  // Slice 5: pinned learned inputs for this attempt (may be absent).
  LearningInputs learning = 6;
}

message ComponentSelection {
  string component_id = 1;
  // Empty when the component was skipped (optional and unfulfillable) or the itinerary is
  // infeasible.
  string offer_id = 2;
  double score = 3;
  ScoreBreakdown breakdown = 4;
  // Alternatives for this component, best first, each with why it was not chosen or why it was
  // infeasible in any combination.
  repeated RankedCandidate ranking = 5;
  // SELECTED | SKIPPED | INFEASIBLE
  string outcome = 6;
  repeated string infeasibility_reasons = 7;
}

message OptimizeItineraryResponse {
  string optimization_run_id = 1;
  // One offer per fulfilled component, tagged with component_id; absent when infeasible.
  travelos.offer.v1.Bundle selected = 2;
  repeated ComponentSelection components = 3;
  // Whole-itinerary reasons when nothing fits, e.g. "LEG_CHRONOLOGY:cmp_a->cmp_b",
  // "NO_HOTEL_COVERS_NIGHTS:cmp_c", "TOTAL_ABOVE_MAX".
  repeated string infeasibility_reasons = 4;
  double score = 5;
  ScoreBreakdown breakdown = 6;
  string solver = 7;
  int64 solve_time_ms = 8;
  int32 combinations_considered = 9;
  // Slice 5: what learning did (or would have done) to this composition.
  LearningEvidence learning = 10;
}

// ---------------------------------------------------------------- Slice 5: learning from outcomes
// A bounded, explainable soft adjustment for one supplier key. Points on the 0..100 score, never
// money. The optimizer clamps every adjustment to [-max_adjustment, +max_adjustment].
message LearningAdjustment {
  // air:<carrier> | hotel:<property id> | ground:<vendor id>
  string supplier_key = 1;
  double adjustment = 2;
  // What it rests on: the smoothed estimate and the evidence behind it.
  double estimate = 3;
  int32 samples = 4;
  // SUPPLIER_RELIABILITY | TRAVELER_PREFERENCE
  string source = 5;
  string reason = 6;
}

// Resolved by the Learning service at planning time through an activity, and pinned to the
// attempt: replays and retries of the same attempt reuse these exact inputs.
message LearningInputs {
  // OFF | SHADOW | ACTIVE. OFF or an absent message reproduces the baseline exactly.
  string mode = 1;
  string profile_id = 2;
  string algorithm_version = 3;
  // SANDBOX | LIVE: the class of evidence the profile was built from.
  string evidence_class = 4;
  repeated LearningAdjustment adjustments = 5;
  double max_adjustment = 6;
  // Why there is no usable profile (NO_ACTIVE_PROFILE, STALE_PROFILE, CLASS_MISMATCH,
  // INCOMPATIBLE_ALGORITHM, LEARNING_UNAVAILABLE, MODE_OFF); empty when a profile applies.
  string fallback_reason = 7;
}

// One candidate's learned contribution, as applied (ACTIVE) or merely computed (SHADOW).
message LearningContribution {
  // A bundle id (OptimizeTrip) or an offer id (OptimizeItinerary).
  string candidate_id = 1;
  string component_id = 2;
  repeated string supplier_keys = 3;
  double baseline_score = 4;
  double adjustment = 5;
  double learned_score = 6;
  repeated string reasons = 7;
}

message LearningEvidence {
  string mode = 1;
  string profile_id = 2;
  string algorithm_version = 3;
  string evidence_class = 4;
  // True only in ACTIVE mode with a usable profile: the selection was made with learning.
  bool applied = 5;
  string fallback_reason = 6;
  // The selection the baseline ranking makes and the one the learned ranking makes; equal when
  // learning changes nothing. In SHADOW mode the baseline one is executed.
  string baseline_selected_id = 7;
  string learned_selected_id = 8;
  repeated LearningContribution contributions = 9;
  double max_adjustment = 10;
}
