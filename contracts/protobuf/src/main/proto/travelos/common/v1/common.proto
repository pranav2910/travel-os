syntax = "proto3";

package travelos.common.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.common.v1";
option java_outer_classname = "CommonProto";

// Money is always carried in minor units (cents for USD) — never floating point.
message Money {
  // ISO 4217 code, e.g. "USD".
  string currency = 1;
  // Amount in the currency's minor unit: 82000 => USD 820.00.
  int64 amount_minor = 2;
}

// Every actor in the platform has an identity: humans, services and agents.
// Agents are machine identities with narrowly scoped capabilities — never "*".
message Principal {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    HUMAN = 1;
    SERVICE = 2;
    AGENT = 3;
  }
  Kind kind = 1;
  // Canonical id: "human/<subject>", "service/<name>", "agent/<name>/<version>".
  string id = 2;
}

// Carried on every internal call. Tenant scoping and traceability are not optional.
message RequestContext {
  string tenant_id = 1;
  // Business correlation id (normally the trip id) — joins the whole lifecycle across traces and events.
  string correlation_id = 2;
  // Id of the command that caused this call (event causation chain).
  string causation_id = 3;
  Principal principal = 4;
  // Required on every mutating command. Format "<scope>:<COMMAND>:<n>", e.g. "trip_01J...:CREATE-ORDER:1".
  string idempotency_key = 5;
}

message TimeWindow {
  google.protobuf.Timestamp not_before = 1;
  google.protobuf.Timestamp not_after = 2;
}

enum Cabin {
  CABIN_UNSPECIFIED = 0;
  ECONOMY = 1;
  PREMIUM_ECONOMY = 2;
  BUSINESS = 3;
  FIRST = 4;
}

// Evidence for one language-model call. Every decision a model influenced carries one of these,
// so "which model, which prompt version, what did it cost" is answerable from the ledger alone.
message ModelCall {
  // llm_<ulid>
  string call_id = 1;
  // anthropic | fake
  string provider = 2;
  string model = 3;
  string prompt_id = 4;
  int32 prompt_version = 5;
  string provider_request_id = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  int64 cache_read_tokens = 9;
  int64 latency_ms = 10;
  // USD micro-dollars (1_000_000 = $1).
  int64 cost_micros = 11;
  google.protobuf.Timestamp called_at = 12;
}
