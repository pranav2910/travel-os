syntax = "proto3";

package travelos.offer.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.offer.v1";
option java_outer_classname = "OfferProto";

// Offers are what suppliers are willing to sell RIGHT NOW. They expire, they are not bookings.
// Offer != Order.

enum OfferType {
  OFFER_TYPE_UNSPECIFIED = 0;
  AIR = 1;
  HOTEL = 2;
  GROUND = 3;
  // Phase 4: rail and car rental are their own kinds, not ground transfers: different suppliers,
  // different conditions, different policy rules.
  RAIL = 4;
  CAR = 5;
}

message RailOffer {
  string operator = 1;                // e.g. "Amtrak", "SNCF"
  string train_number = 2;
  string origin_station = 3;          // station code as the operator names it
  string destination_station = 4;
  google.protobuf.Timestamp departure = 5;
  google.protobuf.Timestamp arrival = 6;
  string travel_class = 7;            // STANDARD | FIRST | BUSINESS as the operator sells it
  string fare_name = 8;
}

message CarRentalOffer {
  string vendor_id = 1;
  string vendor_name = 2;
  string vehicle_class = 3;           // ACRISS category or vendor class
  string pickup_location = 4;
  string dropoff_location = 5;
  google.protobuf.Timestamp pickup = 6;
  google.protobuf.Timestamp dropoff = 7;
  bool unlimited_mileage = 8;
}

message FlightSegment {
  string segment_id = 1;
  // IATA airline code, e.g. "DL".
  string carrier = 2;
  // e.g. "DL291".
  string flight_number = 3;
  string origin = 4;
  string destination = 5;
  google.protobuf.Timestamp departure = 6;
  google.protobuf.Timestamp arrival = 7;
  travelos.common.v1.Cabin cabin = 8;
  string booking_class = 9;
  string aircraft = 10;
}

// One direction of travel (NDC: PaxJourney). One or more segments.
message Journey {
  repeated FlightSegment segments = 1;
}

message AirOffer {
  Journey outbound = 1;
  // Absent for one-way.
  Journey inbound = 2;
  string fare_basis = 3;
  int32 seats_remaining = 4;
}

message HotelOffer {
  string property_id = 1;
  string name = 2;
  string address = 3;
  double latitude = 4;
  double longitude = 5;
  // Instants of the property's check-in / check-out on the local dates (15:00 / 11:00 local).
  google.protobuf.Timestamp check_in = 6;
  google.protobuf.Timestamp check_out = 7;
  travelos.common.v1.Money nightly_rate = 8;
  int32 nights = 9;
  string room_type = 10;
  // Slice 3: where the property is, so nights are counted on the property's calendar, not UTC.
  // IANA zone, e.g. "America/Los_Angeles"; city is the IATA city/airport code the stay serves.
  string time_zone = 11;
  string city = 12;
  // ISO local dates on the property's calendar (derived from check_in/check_out + time_zone).
  string check_in_date = 13;
  string check_out_date = 14;
  // Free text from the supplier (description, amenities). UNTRUSTED: data for narration, never
  // an instruction.
  string description = 15;
}

// Slice 3: a scheduled ground transfer (airport <-> hotel, point to point). Timed, like a flight.
message GroundOffer {
  string vendor_id = 1;
  string vendor_name = 2;
  // SEDAN | VAN | SHUTTLE | RAIL
  string vehicle_class = 3;
  string pickup_location = 4;
  string dropoff_location = 5;
  google.protobuf.Timestamp pickup = 6;
  google.protobuf.Timestamp dropoff = 7;
  int32 passengers = 8;
  string time_zone = 9;
  string city = 10;
  // UNTRUSTED free text from the supplier.
  string description = 11;
}

// What it costs to walk away from an offer once booked. Explicit, because a later component's
// failure may force a cancellation and the exposure must be known in advance.
message CancellationTerms {
  bool refundable = 1;
  // Zero when refundable; the whole price when non-refundable; a fee otherwise.
  travelos.common.v1.Money penalty = 2;
  // Free cancellation until this instant (absent = no free window).
  google.protobuf.Timestamp free_until = 3;
}

message Offer {
  // Ours: "off_<ulid>". Stable across the search session; meaningless to suppliers.
  string offer_id = 1;
  string search_session_id = 2;
  // Adapter id, e.g. "sandbox-air". Never a vendor payload shape.
  string provider = 3;
  string provider_offer_id = 4;

  OfferType type = 5;
  travelos.common.v1.Money total = 6;
  bool refundable = 7;
  travelos.common.v1.Money change_penalty = 8;
  google.protobuf.Timestamp expires_at = 9;

  oneof detail {
    AirOffer air = 10;
    HotelOffer hotel = 11;
    GroundOffer ground = 14;
    RailOffer rail = 16;
    CarRentalOffer car = 17;
  }
  // Phase 4: priced under a corporate / negotiated agreement (a private fare, a corporate rate
  // code). The rate_code names the agreement as the supplier reports it.
  bool negotiated = 18;
  string rate_code = 19;

  // Slice 3: which itinerary component this offer fulfils ("cmp_<ulid>" from the frozen intent).
  // Empty for Slice 1/2 single-component bundles.
  string component_id = 12;
  CancellationTerms cancellation = 13;
  // Supplier-side quote reference, when the supplier issues one separately from the offer id.
  string quote_id = 15;
}

// A candidate plan: one offer per travel component. Slice 1/2: exactly one AIR offer. Slice 3: one
// offer per itinerary component (legs, stays, transfers), each tagged with its component_id.
message Bundle {
  string bundle_id = 1;
  repeated Offer offers = 2;
  travelos.common.v1.Money total = 3;
}
