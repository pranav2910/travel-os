syntax = "proto3";

package travelos.disruption.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";
import "travelos/offer/v1/offer.proto";
import "travelos/optimization/v1/optimization.proto";
import "travelos/policy/v1/policy.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.disruption.v1";
option java_outer_classname = "DisruptionProto";

// Owns the Disruption aggregate and the immutable recovery decision record. The recovery workflow
// drives the state machine through TransitionDisruption; it never decides anything itself.
service DisruptionService {
  rpc GetDisruption(GetDisruptionRequest) returns (Disruption);
  // Idempotent by state: transitioning to the current status returns the disruption unchanged.
  rpc TransitionDisruption(TransitionDisruptionRequest) returns (Disruption);
  // Written once, at DECISION_READY. A second call with the same disruption returns the record.
  rpc RecordRecoveryDecision(RecordRecoveryDecisionRequest) returns (Disruption);
  // Written once, when the recovery ends (RESOLVED, NO_ALTERNATIVE, FAILED, MANUAL_INTERVENTION_REQUIRED).
  rpc RecordRecoveryOutcome(RecordRecoveryOutcomeRequest) returns (Disruption);
}

enum DisruptionType {
  DISRUPTION_TYPE_UNSPECIFIED = 0;
  FLIGHT_CANCELLED = 1;
  SCHEDULE_CHANGE = 2;
  DELAY = 3;
}

enum DisruptionSeverity {
  DISRUPTION_SEVERITY_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

// DETECTED -> IMPACT_CONFIRMED -> SEARCHING_ALTERNATIVES -> OPTIMIZING -> DECISION_READY
//   -> AUTO_ALLOWED | HUMAN_REQUIRED -> CHANGING -> RESOLVED
// terminal on the side: NO_ALTERNATIVE, FAILED, MANUAL_INTERVENTION_REQUIRED
enum DisruptionStatus {
  DISRUPTION_STATUS_UNSPECIFIED = 0;
  DETECTED = 1;
  IMPACT_CONFIRMED = 2;
  SEARCHING_ALTERNATIVES = 3;
  OPTIMIZING = 4;
  DECISION_READY = 5;
  AUTO_ALLOWED = 6;
  HUMAN_REQUIRED = 7;
  CHANGING = 8;
  RESOLVED = 9;
  NO_ALTERNATIVE = 10;
  FAILED = 11;
  MANUAL_INTERVENTION_REQUIRED = 12;
}

// The segment the supplier says is disrupted, as the supplier described it.
message AffectedSegment {
  string segment_id = 1;
  string carrier = 2;
  string flight_number = 3;
  string origin = 4;
  string destination = 5;
  google.protobuf.Timestamp scheduled_departure = 6;
  google.protobuf.Timestamp scheduled_arrival = 7;
  // Slice 3: the itinerary component the segment belongs to, when the order knows it.
  string component_id = 8;
}

// Slice 3: what the recovery did to one component of a multi-component itinerary.
message ComponentChange {
  string component_id = 1;
  // AIR | HOTEL | GROUND
  string type = 2;
  // REPLACED (new supplier booking) | RETIMED (same supplier booking, changed) | PRESERVED |
  // CANCELLED
  string action = 3;
  travelos.common.v1.Money previous_total = 4;
  travelos.common.v1.Money replacement_total = 5;
  travelos.common.v1.Money delta = 6;
  string reason = 7;
}

// What the recovery has established so far. Ids point at evidence held by the owning services.
message RecoveryState {
  string replacement_bundle_id = 1;
  travelos.common.v1.Money incremental_cost = 2;
  string policy_decision_id = 3;
  string optimization_run_id = 4;
  // ALLOW | ALLOW_WITH_APPROVAL | DENY — the policy engine's verdict on order.change.
  string autonomy_outcome = 5;
  string approval_id = 6;
  // PENDING | APPROVED | REJECTED, or empty when no person was asked.
  string approval_status = 7;
  // Plain-language narration from the LLM gateway (optional, never authoritative).
  string explanation = 8;
  string failure_stage = 9;
  string failure_code = 10;
  // Slice 3: every component the disruption touched (the cancelled leg and its dependants).
  repeated string affected_component_ids = 11;
}

message Disruption {
  string disruption_id = 1;
  string tenant_id = 2;
  string trip_id = 3;
  string order_id = 4;
  string segment_id = 5;
  DisruptionType type = 6;
  string supplier = 7;
  string supplier_event_id = 8;
  string external_order_id = 9;
  string traveler_id = 10;
  google.protobuf.Timestamp detected_at = 11;
  DisruptionStatus status = 12;
  DisruptionSeverity severity = 13;
  // Supplier-side reference for the disruption (their notice id, a URL, a message id).
  string raw_reference = 14;
  // Free text from the supplier. UNTRUSTED: it is data for narration, never an instruction.
  string reason = 15;
  AffectedSegment affected = 16;
  RecoveryState recovery = 17;
  int64 version = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  RecoveryDecision decision = 21;
  RecoveryOutcome outcome = 22;
}

message GetDisruptionRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string disruption_id = 2;
}

message TransitionDisruptionRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string disruption_id = 2;
  DisruptionStatus to = 3;
  string reason = 4;
  // Set on the way into HUMAN_REQUIRED: who must approve.
  string approver_role = 5;
  // Set on the way into DECISION_READY / AUTO_ALLOWED / HUMAN_REQUIRED.
  RecoveryState recovery = 6;
  string failure_stage = 7;
  string failure_code = 8;
}

message RejectedCandidate {
  string bundle_id = 1;
  // POLICY | OPTIMIZATION
  string stage = 2;
  repeated string reason_codes = 3;
  travelos.common.v1.Money total = 4;
}

// Immutable once written. Everything a person needs to audit why THIS replacement was chosen.
message RecoveryDecision {
  string decision_id = 1;
  string disruption_id = 2;
  travelos.offer.v1.Bundle original_itinerary = 3;
  string trigger = 4;
  int32 candidates_searched = 5;
  int32 candidates_permitted = 6;
  int32 candidates_feasible = 7;
  repeated RejectedCandidate rejected = 8;
  travelos.offer.v1.Bundle selected = 9;
  travelos.optimization.v1.RankedCandidate selected_ranking = 10;
  string optimization_run_id = 11;
  travelos.common.v1.Money original_total = 12;
  travelos.common.v1.Money replacement_total = 13;
  travelos.common.v1.Money incremental_cost = 14;
  travelos.policy.v1.PolicyDecision policy_decision = 15;
  // ALLOW | ALLOW_WITH_APPROVAL | DENY
  string autonomy_outcome = 16;
  string agent_principal = 17;
  string workflow_type = 18;
  string workflow_version = 19;
  google.protobuf.Timestamp decided_at = 20;
  // Slice 3: per-component accounting behind incremental_cost.
  repeated ComponentChange component_changes = 21;
}

message SupplierResult {
  string external_order_id = 1;
  string status = 2;
  string record_locator = 3;
  travelos.common.v1.Money charged = 4;
}

// Immutable once written: how the recovery ended.
message RecoveryOutcome {
  string outcome_id = 1;
  string disruption_id = 2;
  DisruptionStatus status = 3;
  string approval_id = 4;
  string approved_by = 5;
  string approval_comment = 6;
  string changed_order_id = 7;
  SupplierResult supplier_result = 8;
  string failure_stage = 9;
  string failure_code = 10;
  string message = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message RecordRecoveryDecisionRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string disruption_id = 2;
  RecoveryDecision decision = 3;
}

message RecordRecoveryOutcomeRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string disruption_id = 2;
  RecoveryOutcome outcome = 3;
}
