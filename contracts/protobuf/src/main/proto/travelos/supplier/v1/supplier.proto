syntax = "proto3";

package travelos.supplier.v1;

import "google/protobuf/timestamp.proto";
import "travelos/common/v1/common.proto";
import "travelos/offer/v1/offer.proto";

option java_multiple_files = true;
option java_package = "io.travelos.contracts.supplier.v1";
option java_outer_classname = "SupplierProto";

// The ONLY door to the outside world. Services never see Amadeus/Sabre/NDC shapes — adapters behind
// this interface normalize them. Rate limits, circuit breakers and retries live behind it too.
service SupplierGateway {
  rpc SearchAir(SearchAirRequest) returns (SearchAirResponse);
  // Re-price before booking: offers expire and prices move.
  rpc PriceOffer(PriceOfferRequest) returns (PriceOfferResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  // Slice 2 (disruption recovery). Adapters may return UNIMPLEMENTED until then.
  rpc ChangeOrder(ChangeOrderRequest) returns (ChangeOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  // Slice 3. Typed searches for the other component kinds.
  rpc SearchHotels(SearchHotelsRequest) returns (SearchHotelsResponse);
  rpc SearchGround(SearchGroundRequest) returns (SearchGroundResponse);
  // Revalidate ANY offer (air, hotel, ground) before a mutation: is it still sold, at what price,
  // until when. PriceOffer stays for air callers; QuoteOffer is the general form.
  rpc QuoteOffer(QuoteOfferRequest) returns (QuoteOfferResponse);
  // What a supplier did with a command whose answer we never saw: by its external id or by the
  // idempotency key we sent. The reconciliation step before any retry of a mutation.
  rpc GetBookingStatus(GetBookingStatusRequest) returns (BookingStatus);
  // What an adapter can do, so callers change what can be changed and cancel + rebook the rest.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (SupplierCapabilities);
  // Phase 4: rail and car rental are distinct kinds with their own adapters (none SIMULATED yet:
  // the search answers with an empty result and a NO_PROVIDER error until one is registered).
  rpc SearchRail(SearchRailRequest) returns (SearchRailResponse);
  rpc SearchCars(SearchCarsRequest) returns (SearchCarsResponse);
}

message SearchAirRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string origin = 2;
  string destination = 3;
  travelos.common.v1.TimeWindow outbound_departure = 4;
  // Absent => one-way.
  travelos.common.v1.TimeWindow return_departure = 5;
  int32 passengers = 6;
  repeated travelos.common.v1.Cabin cabins = 7;
}

message SupplierError {
  string provider = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
}

message SearchAirResponse {
  string search_session_id = 1;
  repeated travelos.offer.v1.Offer offers = 2;
  // Partial results are normal: one adapter failing must not fail the search.
  repeated SupplierError errors = 3;
}

message PriceOfferRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
  string provider_offer_id = 3;
}

message PriceOfferResponse {
  travelos.offer.v1.Offer offer = 1;
  bool price_changed = 2;
}

// Minimal passenger data. Passport / national ID never travels through here — that belongs to a
// separately encrypted vault domain when (if) international travel is added.
message Passenger {
  string given_name = 1;
  string family_name = 2;
  string email = 3;
  string loyalty_number = 4;
  // Phase 4: what real suppliers need to ticket. Fetched from Enterprise Context at booking time
  // (purpose BOOKING, logged) and passed through; never persisted by the Order service or the
  // gateway. Empty when the profile does not know them.
  string phone = 5;
  string date_of_birth = 6;           // YYYY-MM-DD
  string gender = 7;                  // M | F | X
  string title = 8;                   // mr | ms | mrs | dr as the supplier wants it
  repeated PassengerDocument documents = 9;
  string loyalty_program = 10;        // airline / hotel program code the loyalty_number belongs to
}

message PassengerDocument {
  string type = 1;                    // PASSPORT | NATIONAL_ID | VISA
  string number = 2;
  string issuing_country = 3;         // ISO 3166-1 alpha-2
  string nationality = 4;
  string expires_on = 5;              // YYYY-MM-DD
}

enum SupplierOrderStatus {
  SUPPLIER_ORDER_STATUS_UNSPECIFIED = 0;
  HELD = 1;
  CONFIRMED = 2;
  FAILED = 3;
  CANCELLED = 4;
  CHANGED = 5;
  // Slice 3: the supplier has no record of the command (safe to retry).
  NOT_FOUND = 6;
}

message CreateOrderRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
  string provider_offer_id = 3;
  repeated Passenger passengers = 4;
  // Opaque token from the payment provider — never a PAN.
  string payment_token = 5;
}

message CreateOrderResponse {
  string external_order_id = 1;
  string record_locator = 2;
  SupplierOrderStatus status = 3;
  travelos.common.v1.Money charged = 4;
  repeated string ticket_numbers = 5;
}

message ChangeOrderRequest {
  // ctx.idempotency_key is REQUIRED: N retries => one reissue at the supplier.
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
  string external_order_id = 3;
  string new_provider_offer_id = 4;
  // Opaque token for the incremental charge (or refund). Never a PAN.
  string payment_token = 5;
}

message ChangeOrderResponse {
  string external_order_id = 1;
  SupplierOrderStatus status = 2;
  // Positive when the traveler's company pays more, negative when the supplier refunds.
  travelos.common.v1.Money incremental_cost = 3;
  string record_locator = 4;
  repeated string ticket_numbers = 5;
  travelos.common.v1.Money charged_total = 6;
}

message CancelOrderRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
  string external_order_id = 3;
}

message CancelOrderResponse {
  string external_order_id = 1;
  SupplierOrderStatus status = 2;
  travelos.common.v1.Money refund = 3;
  // Phase 5: what the supplier keeps as a credit for future travel instead of money back (an
  // airline voucher for a non-refundable fare). Distinct from a refund: it is not money moved.
  travelos.common.v1.Money credit = 4;
  string credit_reference = 5;
  google.protobuf.Timestamp credit_expires_at = 6;
}

// ---------------------------------------------------------------- Slice 3

message SearchHotelsRequest {
  travelos.common.v1.RequestContext ctx = 1;
  // IATA city/airport code.
  string city = 2;
  // ISO local dates on the property's calendar.
  string check_in_date = 3;
  string check_out_date = 4;
  int32 guests = 5;
}

message SearchHotelsResponse {
  string search_session_id = 1;
  repeated travelos.offer.v1.Offer offers = 2;
  repeated SupplierError errors = 3;
}

message SearchGroundRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string city = 2;
  // AIRPORT_TO_HOTEL | HOTEL_TO_AIRPORT | POINT_TO_POINT
  string kind = 3;
  string from_location = 4;
  string to_location = 5;
  // The pickup must fall in this window (UTC instants).
  travelos.common.v1.TimeWindow pickup = 6;
  int32 passengers = 7;
}

message SearchGroundResponse {
  string search_session_id = 1;
  repeated travelos.offer.v1.Offer offers = 2;
  repeated SupplierError errors = 3;
}

message QuoteOfferRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
  string provider_offer_id = 3;
}

message QuoteOfferResponse {
  // The offer as the supplier sells it now (new expiry, current price).
  travelos.offer.v1.Offer offer = 1;
  bool price_changed = 2;
  // The offer's original expiry had passed; the supplier re-quoted it (offer.expires_at is new).
  bool requoted = 3;
}

message GetBookingStatusRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
  // One of the two identifies the booking.
  string external_order_id = 3;
  string idempotency_key = 4;
}

message BookingStatus {
  // NOT_FOUND when the supplier never recorded the command.
  SupplierOrderStatus status = 1;
  string external_order_id = 2;
  string record_locator = 3;
  travelos.common.v1.Money charged = 4;
  repeated string ticket_numbers = 5;
}

message GetCapabilitiesRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string provider = 2;
}

message SupplierCapabilities {
  string provider = 1;
  repeated travelos.offer.v1.OfferType types = 2;
  // ChangeOrder is supported (otherwise a change is cancel + create).
  bool change_supported = 3;
  bool cancel_supported = 4;
  bool status_lookup_supported = 5;
  bool notifications_supported = 6;
  // SIMULATED | LIVE: the sandbox adapters are simulations and say so.
  string integration = 7;
  // Phase 4. Whether the supplier honours our idempotency key on mutations (then a retry with the
  // same key is safe at the supplier); when false the gateway's mutation ledger is the only
  // protection and a lost answer is reconciled by lookup or reported as OUTCOME_UNKNOWN.
  bool mutations_idempotent = 8;
  // The adapter can search under corporate / negotiated agreements (private fares, rate codes).
  bool negotiated_rates_supported = 9;
  // A lost answer can be reconciled by our key or reference (GetBookingStatus by idempotency_key).
  bool reconciliation_by_key_supported = 10;
}

// ---------------------------------------------------------------- Phase 4: rail and car

message SearchRailRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string origin = 2;                  // station or city code as the platform's catalog names it
  string destination = 3;
  travelos.common.v1.TimeWindow departure = 4;
  int32 passengers = 5;
}

message SearchRailResponse {
  string search_session_id = 1;
  repeated travelos.offer.v1.Offer offers = 2;
  repeated SupplierError errors = 3;
}

message SearchCarsRequest {
  travelos.common.v1.RequestContext ctx = 1;
  string pickup_location = 2;         // IATA airport / city code
  string dropoff_location = 3;
  google.protobuf.Timestamp pickup = 4;
  google.protobuf.Timestamp dropoff = 5;
  string vehicle_class = 6;           // optional ACRISS category
}

message SearchCarsResponse {
  string search_session_id = 1;
  repeated travelos.offer.v1.Offer offers = 2;
  repeated SupplierError errors = 3;
}
