# Local platform for travel-os. DEV ONLY: every credential here is public and disposable.
# Java services run on the host (./gradlew :services:<name>:bootRun) and connect to these ports.
#   make up    -> start + wait healthy, then create Kafka topics
#   make down  -> stop (data kept)      make nuke -> stop + wipe
name: travelos

x-healthcheck-defaults: &hc
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 30s

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: travelos
      POSTGRES_PASSWORD: travelos-dev
      POSTGRES_DB: travelos
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=250ms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U travelos -d travelos"]

  redis:
    image: redis:8.8.2
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # HOST is what services on the laptop use; INTERNAL is for other containers (kafka-init).
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared in contracts/events/topics.yaml and created by kafka-init. Never auto-created.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "9092:9092"
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]

  # One-shot: creates the declared topics. Run with `docker compose run --rm kafka-init` (make up does).
  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["init"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092
      PARTITIONS: 3
      REPLICATION: 1
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: travelos
      POSTGRES_PWD: travelos-dev
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
      DEFAULT_NAMESPACE: travelos
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING"]

  temporal-ui:
    image: temporalio/ui:2.54.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  keycloak:
    image: keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      <<: *hc
      # Keycloak's image has no curl; bash's /dev/tcp is the documented way to probe the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]

volumes:
  postgres-data:
