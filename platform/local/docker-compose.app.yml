# The application layer on top of docker-compose.yml: every runnable component as a container.
#   make images     -> build ghcr.io/pranav2910/travel-os/<name>:local from the jars
#   make stack-up   -> infra + all 8 services, wait until healthy, create topics
#   make stack-e2e  -> scripts/e2e-slice1.sh against it (same ports as running on the host)
# Java services run with the `container` Spring profile: see application-container.yml in each service.
name: travelos

x-java: &java
  restart: unless-stopped
  mem_limit: 512m
  healthcheck: &java-health
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s
    # eclipse-temurin has no curl; bash's /dev/tcp does the probe (sh is dash, so call bash explicitly).
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT} && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: container
  TRACING_EXPORT_ENABLED: "true"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  TEMPORAL_ADDRESS: temporal:7233
  OIDC_ISSUER_URI: http://localhost:8180/realms/travelos
  OIDC_JWK_SET_URI: http://keycloak:8180/realms/travelos/protocol/openid-connect/certs

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  keycloak:
    condition: service_healthy

services:
  travel-core:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/travel-core:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/travel-core/build/libs/travel-core-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8081
      GRPC_PORT: 9081
      TRAVEL_CORE_DB_URL: jdbc:postgresql://postgres:5432/travel_core
      # Profiles & arranger authorization (ADR-0014); the channel is opened lazily, so start order
      # does not matter.
      ENTERPRISE_CONTEXT_ADDRESS: enterprise-context:9090
    ports:
      - "8081:8081"
      - "9081:9081"
    depends_on:
      <<: *infra-ready
      temporal:
        condition: service_healthy

  policy:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/policy:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/policy/build/libs/policy-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8082
      GRPC_PORT: 9082
      POLICY_DB_URL: jdbc:postgresql://postgres:5432/policy
    ports:
      - "8082:8082"
      - "9082:9082"
    depends_on: *infra-ready

  supplier-gateway:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/supplier-gateway:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/supplier-gateway/build/libs/supplier-gateway-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8084
      GRPC_PORT: 9084
      SUPPLIER_GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/supplier_gateway
      # Phase 4: real suppliers exist only when these are set in the shell; never written here.
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
      HOTELBEDS_API_KEY: ${HOTELBEDS_API_KEY:-}
      HOTELBEDS_SECRET: ${HOTELBEDS_SECRET:-}
      HOTELBEDS_BASE_URL: ${HOTELBEDS_BASE_URL:-https://api.test.hotelbeds.com}
    ports:
      - "8084:8084"
      - "9084:9084"
    depends_on: *infra-ready

  order:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/order:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/order/build/libs/order-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8085
      GRPC_PORT: 9085
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orders
      SUPPLIER_GATEWAY_ADDRESS: supplier-gateway:9084
      # Phase 5: the live payment provider exists only when this is set in the shell (sk_test_ first).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "8085:8085"
      - "9085:9085"
    depends_on:
      <<: *infra-ready
      supplier-gateway:
        condition: service_healthy

  audit:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/audit:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/audit/build/libs/audit-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8088
      AUDIT_DB_URL: jdbc:postgresql://postgres:5432/audit
    ports:
      - "8088:8088"
    depends_on: *infra-ready

  disruption:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/disruption:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/disruption/build/libs/disruption-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8089
      GRPC_PORT: 9089
      DISRUPTION_DB_URL: jdbc:postgresql://postgres:5432/disruption
      ORDER_ADDRESS: order:9085
    ports:
      - "8089:8089"
      - "9089:9089"
    depends_on:
      <<: *infra-ready
      order:
        condition: service_healthy

  enterprise-context:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/enterprise-context:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/enterprise-context/build/libs/enterprise-context-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8090
      GRPC_PORT: 9090
      ENTERPRISE_CONTEXT_DB_URL: jdbc:postgresql://postgres:5432/enterprise_context
      TRAVEL_CORE_ADDRESS: travel-core:9081
      CONTEXT_SYNC_INTERVAL: 30s
      # Field-encryption key for profiles (base64 AES-256). LOCAL STACK ONLY: this value protects
      # nothing but a laptop's sandbox data; every other environment gets its key from a secret.
      TRAVELOS_FIELD_KEY: ${TRAVELOS_FIELD_KEY:-bG9jYWwtZGV2LW9ubHktZmllbGQta2V5LTMyYnl0ZXM=}
      # Phase 7: provisioning tokens and enterprise credentials come from the shell (never from this
      # file); absent = no SCIM for that tenant, no live adapter. The local stack uses a dev token.
      SCIM_TOKEN_ACME: ${SCIM_TOKEN_ACME:-local-dev-only-scim-token-acme}
      WORKDAY_REPORT_URL: ${WORKDAY_REPORT_URL:-}
      WORKDAY_USERNAME: ${WORKDAY_USERNAME:-}
      WORKDAY_PASSWORD: ${WORKDAY_PASSWORD:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      CONCUR_CLIENT_ID: ${CONCUR_CLIENT_ID:-}
      CONCUR_CLIENT_SECRET: ${CONCUR_CLIENT_SECRET:-}
      CONCUR_REFRESH_TOKEN: ${CONCUR_REFRESH_TOKEN:-}
    ports:
      - "8090:8090"
      - "9090:9090"
    depends_on:
      <<: *infra-ready
      travel-core:
        condition: service_healthy

  learning:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/learning:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/learning/build/libs/learning-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8091
      GRPC_PORT: 9091
      LEARNING_DB_URL: jdbc:postgresql://postgres:5432/learning
      LEARNING_DEPLOYMENT_CLASS: SANDBOX
      LEARNING_SCALE: "100"
    ports:
      - "8091:8091"
      - "9091:9091"
    depends_on:
      <<: *infra-ready

  assistance:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/assistance:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: services/assistance/build/libs/assistance-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8092
      ASSISTANCE_DB_URL: jdbc:postgresql://postgres:5432/assistance
      # Phase 8: delivery channels are credential-gated (from the shell); absent = in-app only.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      NOTIFICATIONS_FROM_ADDRESS: ${NOTIFICATIONS_FROM_ADDRESS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8092:8092"
    depends_on:
      <<: *infra-ready

  # The web app: the React build behind nginx, which also proxies /api/v1/* to the services above, so
  # the browser talks to one origin (http://localhost:8080). Keycloak stays on :8180 (OIDC redirects).
  web:
    image: ghcr.io/pranav2910/travel-os/web:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    read_only: true # as on Kubernetes: everything nginx writes lives under /tmp
    tmpfs: [/tmp]
    environment:
      OIDC_AUTHORITY: http://localhost:8180/realms/travelos
      OIDC_CLIENT_ID: travelos-web
      DEPLOYMENT_CLASS: SANDBOX
      ENVIRONMENT_LABEL: docker stack
    ports:
      - "8080:8080"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    depends_on:
      travel-core: { condition: service_healthy }
      learning: { condition: service_healthy }
      assistance: { condition: service_healthy }

  trip-planning:
    <<: *java
    image: ghcr.io/pranav2910/travel-os/trip-planning:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/java.Dockerfile
      args:
        JAR: workflows/trip-planning/build/libs/trip-planning-0.1.0-SNAPSHOT.jar
    environment:
      <<: *java-env
      PORT: 8086
      TRAVEL_CORE_ADDRESS: travel-core:9081
      POLICY_ADDRESS: policy:9082
      OPTIMIZATION_ADDRESS: optimization:9083
      SUPPLIER_GATEWAY_ADDRESS: supplier-gateway:9084
      ORDER_ADDRESS: order:9085
      LLM_GATEWAY_ADDRESS: llm-gateway:9087
      DISRUPTION_ADDRESS: disruption:9089
      ENTERPRISE_CONTEXT_ADDRESS: enterprise-context:9090
      LEARNING_ADDRESS: learning:9091
    ports:
      - "8086:8086"
    depends_on:
      <<: *infra-ready
      temporal:
        condition: service_healthy
      travel-core:
        condition: service_healthy
      policy:
        condition: service_healthy
      order:
        condition: service_healthy

  optimization:
    image: ghcr.io/pranav2910/travel-os/optimization:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/python.Dockerfile
      args:
        MODULE: optimization
        ENTRY: travelos_optimization.server
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GRPC_PORT: 9083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "9083:9083"

  llm-gateway:
    image: ghcr.io/pranav2910/travel-os/llm-gateway:${TAG:-local}
    build:
      context: ../..
      dockerfile: docker/python.Dockerfile
      args:
        MODULE: llm-gateway
        ENTRY: travelos_llm_gateway.server
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GRPC_PORT: 9087
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # fake by default; export ANTHROPIC_API_KEY (and optionally LLM_PROVIDER=anthropic) to use Claude.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_TENANT_DAILY_BUDGET_USD: ${LLM_TENANT_DAILY_BUDGET_USD:-5}
    ports:
      - "9087:9087"
