spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test-issuer/realms/travelos
  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      properties:
        metadata.max.age.ms: 1000
travelos:
  outbox:
    poll-interval: 200ms
  assistance:
    sla:
      critical: 2s
      high: 4h
      normal: 24h
      low: 72h
    escalation-sweep: 500ms
