spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test-issuer/realms/travelos
  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      properties:
        metadata.max.age.ms: 1000
travelos:
  grpc:
    server:
      port: 0
  temporal:
    enabled: false
  outbox:
    poll-interval: 200ms
  disruption:
    impact-retry-interval: 2s
