spring:
  application:
    name: enterprise-context
  datasource:
    # The enterprise_context_app role can reach ONLY the enterprise_context database (ADR-0006).
    url: ${ENTERPRISE_CONTEXT_DB_URL:jdbc:postgresql://localhost:5432/enterprise_context}
    username: ${ENTERPRISE_CONTEXT_DB_USER:enterprise_context_app}
    password: ${ENTERPRISE_CONTEXT_DB_PASSWORD:enterprise_context-dev}
    hikari:
      maximum-pool-size: ${ENTERPRISE_CONTEXT_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 2000
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        request.timeout.ms: 15000
        linger.ms: 5
        delivery.timeout.ms: 45000
    consumer:
      group-id: enterprise-context
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/travelos}
          audiences: travelos-api
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8090}
  shutdown: graceful

travelos:
  web:
    # Connector webhooks are signed by the provider (HMAC-SHA256), not by a tenant's JWT.
    public-paths: /api/v1/connectors/*/events
  grpc:
    server:
      port: ${GRPC_PORT:9090}
    clients:
      travel-core:
        address: ${TRAVEL_CORE_ADDRESS:localhost:9081}
        deadline: 15s
  outbox:
    poll-interval: 500ms
  context:
    # How often ENABLED connectors are offered a scheduled synchronization (a run is one Temporal
    # workflow on the trip-planning worker; only one run per connector is in flight at a time).
    sync-interval: ${CONTEXT_SYNC_INTERVAL:60s}
    scheduler-tick: ${CONTEXT_SCHEDULER_TICK:10s}
    connectors:
      # SIMULATED providers. Their webhook secret is shared, like the airline's.
      sandbox-webhook-secret: ${SANDBOX_CONNECTOR_WEBHOOK_SECRET:sandbox-connector-dev-webhook-secret}
      sandbox-page-size: ${SANDBOX_CONNECTOR_PAGE_SIZE:3}
  profiles:
    # Encrypted passenger fields (ADR-0014). A base64 AES-256 key from the platform's secret store;
    # the service refuses to start without one.
    field-key: ${TRAVELOS_FIELD_KEY:}
  # Phase 7: provisioning and genuine enterprise adapters. Every credential is optional and comes
  # from the secrets mechanism; an absent one means that adapter is not registered.
  context.integrations:
    scim:
      tokens:
        acme: ${SCIM_TOKEN_ACME:}
        globex: ${SCIM_TOKEN_GLOBEX:}
    workday:
      report-url: ${WORKDAY_REPORT_URL:}
      username: ${WORKDAY_USERNAME:}
      password: ${WORKDAY_PASSWORD:}
    google:
      service-account-email: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:}
      private-key: ${GOOGLE_SERVICE_ACCOUNT_KEY:}
    microsoft:
      tenant-id: ${MICROSOFT_TENANT_ID:}
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
    salesforce:
      instance-url: ${SALESFORCE_INSTANCE_URL:}
      client-id: ${SALESFORCE_CLIENT_ID:}
      client-secret: ${SALESFORCE_CLIENT_SECRET:}
    concur:
      client-id: ${CONCUR_CLIENT_ID:}
      client-secret: ${CONCUR_CLIENT_SECRET:}
      refresh-token: ${CONCUR_REFRESH_TOKEN:}
    document-retention-days: ${PROFILE_DOCUMENT_RETENTION_DAYS:90}
    retention-sweep: ${PROFILE_RETENTION_SWEEP:1h}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{tenant_id:-}] [%X{principal:-}] [%X{correlation_id:-}] "

