spring:
  application:
    name: supplier-gateway
  datasource:
    url: ${SUPPLIER_GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/supplier_gateway}
    username: ${SUPPLIER_GATEWAY_DB_USER:supplier_gateway_app}
    password: ${SUPPLIER_GATEWAY_DB_PASSWORD:supplier_gateway-dev}
    hikari:
      maximum-pool-size: ${SUPPLIER_GATEWAY_DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        request.timeout.ms: 15000
        linger.ms: 5
        delivery.timeout.ms: 45000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/travelos}
          audiences: travelos-api
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8084}
  shutdown: graceful

travelos:
  web:
    # Supplier webhooks authenticate themselves (HMAC signature), not with a tenant's JWT.
    public-paths: /api/v1/suppliers/*/events
  grpc:
    server:
      port: ${GRPC_PORT:9084}
  suppliers:
    sandbox-air:
      # Shared secret the sandbox airline signs its notices with. DEV-ONLY default; every deployed
      # environment injects its own (Secret on kind, Secrets Manager on EKS).
      webhook-secret: ${SANDBOX_AIR_WEBHOOK_SECRET:sandbox-air-dev-webhook-secret}
      # Per-adapter protection. Real suppliers publish their limits; these are the sandbox's.
      rate-limit-per-second: 50
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-in-open-state: 30s
    # Slice 3: the SIMULATED hotel and ground suppliers (no webhooks, so no secret).
    sandbox-hotel:
      rate-limit-per-second: 50
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-in-open-state: 30s
    sandbox-ground:
      rate-limit-per-second: 50
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-in-open-state: 30s
    # Phase 4: real suppliers' protection settings (their published limits are lower than the
    # sandbox's). The adapters themselves exist only when travelos.integrations.* credentials do.
    duffel:
      rate-limit-per-second: 10
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-in-open-state: 60s
    hotelbeds:
      rate-limit-per-second: 10
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-in-open-state: 60s
  # Phase 4 (ADR-0016): credentials come ONLY from the secrets mechanism. Empty = adapter absent.
  integrations:
    duffel:
      access-token: ${DUFFEL_ACCESS_TOKEN:}
      base-url: ${DUFFEL_BASE_URL:https://api.duffel.com}
      timeout: 20s
      # private-fares:            # airline IATA code -> corporate code, e.g.
      #   UA: ${DUFFEL_UA_CORPORATE_CODE:}
    hotelbeds:
      api-key: ${HOTELBEDS_API_KEY:}
      secret: ${HOTELBEDS_SECRET:}
      base-url: ${HOTELBEDS_BASE_URL:https://api.test.hotelbeds.com}
      timeout: 20s
      radius-km: 25

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Off unless asked (tests, ad-hoc runs); `make run*` and the Docker stack turn it on. Boot 4
      # disables W3C propagation together with export, so with this off traces do not cross hops.
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{tenant_id:-}] [%X{principal:-}] [%X{correlation_id:-}] "
