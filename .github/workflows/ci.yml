name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Phase 11: run the full check on a branch without a pull request (gh workflow run ci.yml --ref <branch>).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  java:
    name: gradle check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Python services are part of the same Gradle check (intelligence/*/build.gradle.kts).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "intelligence/**/uv.lock"
      - name: check
        run: ./gradlew check --no-daemon --stacktrace
      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  web:
    name: web app (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install (pinned)
        run: cd web && npm ci --no-audit --no-fund
      - name: lint, typecheck, unit tests, production build
        run: cd web && npm run check

  images:
    name: container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [java, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: jars
        run: make jars
      - name: login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build (and on main, push) all images
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            scripts/build-images.sh "${{ github.sha }}" --push
            scripts/build-images.sh main --push
          else
            scripts/build-images.sh "pr-${{ github.event.number }}"
          fi

  helm:
    name: helm charts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: lint, render and schema-check (kind + EKS values)
        run: make helm-lint

  terraform:
    name: terraform static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
      - name: fmt, validate, tflint, trivy (no credentials, nothing applied)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # tflint --init fetches its ruleset from GitHub releases; anonymous calls are rate-limited
        run: make tf-check
