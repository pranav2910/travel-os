# The strongest proof the platform has: the full Slice 1 flow + chaos + NetworkPolicy enforcement
# inside a real (kind) Kubernetes cluster. Too slow for every Java change, so it runs on merges that
# touch deployment, infrastructure, workflows or scripts, nightly, and on demand.
name: kind-e2e

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - infrastructure/**
      - workflows/**
      - scripts/**
      - services/**
      - intelligence/**
      - web/**
      - docker/**
      - contracts/**
      - platform/local/**
      - .github/workflows/kind-e2e.yml
  schedule:
    - cron: "0 6 * * *"   # nightly, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind:
    name: slices 1-5 + web on kind (e2e + chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      KIND_VERSION: v0.31.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: free disk space
        # ubuntu-latest leaves ~14 GB free; a 4-node kind cluster, the local registry and nine
        # ~700 MB images (pulled again inside the nodes) need more than that, and a full disk kills
        # the runner itself, silently (no logs, no diagnostics). Drop toolchains this job never uses.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm/temurin-8-jdk-amd64 || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: kind
        run: |
          sudo curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          kind version; kubectl version --client; helm version; docker version --format '{{.Server.Version}}'
      - name: cluster (3 zones, Calico, metrics-server, registry)
        run: make kind-up
      - name: secrets (random, never leave the runner)
        run: deploy/kind/secrets.sh
      - name: build :<sha> images, deploy infra + services
        run: make kind-deploy
      - name: reclaim the build cache (the images now live in the registry and the nodes)
        run: |
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: slice 1 end-to-end
        run: make kind-e2e
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: browser E2E against the cluster (Chromium + WebKit; real Keycloak, real bookings)
        run: |
          cd web && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          cd .. && make web-e2e-kind
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-e2e-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
      - name: chaos (pod kills mid-workflow, NetworkPolicy enforcement)
        run: make kind-chaos
      - name: slice 2 end-to-end (autonomous + approved recovery, injection, duplicates, trace)
        run: make kind-e2e2
      - name: slice 2 chaos (recovery worker + order service killed during ChangeOrder)
        run: make kind-chaos2
      - name: slice 3 end-to-end (multi-city itineraries, hotels, ground, revalidation, compensation, connected recovery)
        run: make kind-e2e3
      - name: slice 3 chaos (7-component booking and its recovery held at proven points, worker killed)
        run: make kind-chaos3
      - name: slice 4 end-to-end (calendar/CRM/HRIS/expense demand detection -> governed trip, carry-overs)
        run: make kind-e2e4
      - name: slice 4 chaos (source outage, rate limit, context service and worker killed mid-sync)
        run: make kind-chaos4
      - name: slice 5 end-to-end (outcomes -> evaluated profile -> shadow/active ranking, safeguards, activation/rollback)
        run: make kind-e2e5
      - name: slice 5 chaos (learning service and worker killed mid-plan and mid-build, consumer restart, pinned inputs)
        run: make kind-chaos5
      - name: diagnostics
        if: failure()
        run: |
          mkdir -p diag
          { df -h; docker system df; } > diag/disk.txt || true
          kubectl get pods -A -o wide > diag/pods.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > diag/events.txt || true
          for ns in travelos travelos-infra; do
            for p in $(kubectl -n $ns get pods -o name); do
              kubectl -n $ns describe "$p" > "diag/${ns}-$(basename $p).describe.txt" || true
              kubectl -n $ns logs "$p" --all-containers --tail=2000 > "diag/${ns}-$(basename $p).log" || true
            done
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: kind-diagnostics
          path: diag/
